name: "aipassage-backend"
services:
  java-backend:
    build:
      context: "."
      dockerfile: "Dockerfile"
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${AIPASSAGE_BACKEND_LOCAL_PORT}:8080"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8080
      - SPRING_FLYWAY_ENABLED=${AIPASSAGE_DB_MIGRATION_ENABLED}
      - SPRING_FLYWAY_LOCATIONS=${AIPASSAGE_DB_MIGRATION_LOCATIONS}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${AIPASSAGE_DB_DBNAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=${AIPASSAGE_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${AIPASSAGE_DB_USER_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - PEXELS_API_KEY=${AIPASSAGE_PEXELS_API_KEY}
      - NANO_BANANA_API_KEY=${AIPASSAGE_NANO_BANANA_API_KEY}
      - NANO_BANANA_MODEL=${AIPASSAGE_NANO_BANANA_MODEL}
      - SPRING_AI_DASHSCOPE_API-KEY=${AIPASSAGE_DASHSCOPE_API_KEY}
      - COS_CLIENT_SECRET-ID=${AIPASSAGE_COS_SECRET_ID}
      - COS_CLIENT_SECRET-KEY=${AIPASSAGE_COS_SECRET_KEY}
      - COS_CLIENT_REGION=${AIPASSAGE_COS_REGION}
      - COS_CLIENT_BUCKET=${AIPASSAGE_COS_BUCKET}
  redis:
    image: redis:8.8
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      - "${AIPASSAGE_REDIS_LOCAL_PORT}:6379"
    environment:
      - TZ=Asia/Shanghai
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${AIPASSAGE_DB_LOCAL_PORT}:3306"
    expose:
      - "3306"
    environment:
      - TZ=Asia/Shanghai
      - LANG=C.UTF-8
      - MYSQL_ROOT_PASSWORD=${AIPASSAGE_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${AIPASSAGE_DB_DBNAME}
      - MYSQL_USER=${AIPASSAGE_DB_USERNAME}
      - MYSQL_PASSWORD=${AIPASSAGE_DB_USER_PASSWORD}
